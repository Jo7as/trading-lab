# Portfolio TK6 - Trendkorb 6. EINGEFROREN: nicht ändern (siehe TK6.lock).
id: TK6
name: Trendkorb 6
rolle: primaer
beschreibung: Alle 6 Varianten, die S1-S3 bestanden haben, beim Placebo klar vorne
  liegen (> +0.05 R) und PBO <= 0.25 haben. Der Haupttest.
erstellt: '2026-10-26'
quelle: 'studies/optimize_all.py (Budget 150, Train 2019-01-01..2024-12-31), Auswahl:
  studies/portfolio_build.py'
auswahlregel:
  stage: S3
  min_placebo_edge: 0.05
  max_pbo: 0.25
