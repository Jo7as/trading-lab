id: H-009
titel: FX-Carry mit Ruhe-Filter und gemarkteter Finanzierung ist netto tragfaehig
status: widerlegt
skript: studies/carry_real_swaps.py
stufe: S1
erstellt: 2026-10-24
autor: ''
beobachtung: 'Nachfolge von H-008. Dessen Preis-Claim war zu streng formuliert (Preis-Sharpe
  >= 1.0 verfehlt), waehrend die wirtschaftlich relevante Groesse - Preis PLUS Finanzierung
  - deutlich positiv ist. Getestet mit echten FRED-Zinsen (monatliche 3M-Interbank,
  14 Waehrungen) und einer konservativen Broker-Marge von 30% auf die Zinsdifferenz.

  '
mechanismus:
  wer: Carry-Investoren als Risikopraemie-Empfaenger; Funding-Waehrungen JPY/CHF
  warum: 'Wer die Hochzins-Waehrung haelt, bekommt die Zinsdifferenz (Swap, hier um
    30% gekuerzt) und traegt dafuer Crash-Risiko; der Ruhig-Filter schaltet genau
    die Risk-off-Phasen ab.

    '
  quellen:
  - 'Lustig, Verdelhan, Roussanov (2007): Common Risk Factors in Currency Markets,
    RFS'
  - 'Brunnermeier, Nagel, Pedersen (2008): Carry Trades and Currency Crashes'
  - 'FRED: monatliche 3M-Interbank-Saetze (IR3TIB01*M156N); Roll-Diagnostik zeigt,
    dass der CFD-Preis den Carry NICHT zahlt -> Finanzierung separat angesetzt'
