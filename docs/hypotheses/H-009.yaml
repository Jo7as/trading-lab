datenabschnitt: train
ergebnis: "Getestet 2026-10-24. Basis (26 Paare, -30% Marge, Filter, n=58 aktive Monate):\
  \ CAGR +13.3% / Vola 8.4% / Sharpe 1.59 / MDD -8.9% / 74% positive Monate; Train\
  \ 2019-23 Sharpe 1.30, Holdout 2024-26 2.75 (CAGR 15.7%, MDD -2.6%); Zufalls-Ranking-Placebo:\
  \ CAGR -8.1% / Sharpe -1.00 / MDD -36.2% -> deutlich geschlagen. Alle 8 Jahre positiv\
  \ (2.8%..17.4%). G10-only: Sharpe 0.97 / MDD -13.2% (Exoten tragen die Haelfte).\
  \ Claim erfuellt (>= 10%/yr und Sharpe >= 1.2, in Sample und Holdout; Placebo negativ).\
  \ OFFEN/VORBEHALTE: (1) echte Broker-Swap-/Spread-Saetze fuer die 5 Exoten-Legs\
  \ fehlen weiterhin (FRED + 30% Marge ist ein Modell); (2) Dosis-Wirkung nicht monoton\
  \ -> Positionsgroesse nicht nach Carry-Hoehe skalieren; (3) Vola-Ziel-Hebel verworfen\
  \ (0.78 -> 0.67 Sharpe, MDD -13.2% -> -18.7%); (4) Carry braucht Overnight-/Wochenendhaltung\
  \ (Firmenregeln pruefen); (5) bei 1x betraegt der MDD ~-9% (volle Quote) bzw. ~-13%\
  \ (G10) -> fuer ein 10%-Prop-Limit nur ohne Hebel, fuer das Zielband 2-4%/Monat\
  \ braucht es Hebel und damit ein 20%-Limit-Konto oder Eigenkapital.\n MARGE-ASYMMETRIE\
  \ + 3x-ROLLOVER (2026-10-24, studies/carry_margin_sensitivity.py): Selbstkontrolle\
  \ bestanden (symmetrisch -30% reproduziert Sharpe 1.59/MDD -8.9%). asymmetrisch\
  \ L10/S30: +14.0%/1.67/-8.8%; L20/S50: +13.0%/1.55/-9.1%; L20/S50 + 3x-Rollover:\
  \ +14.2%/1.69/-8.8%; BRUTAL L30/S70 + 3x: +12.9%/1.54/-9.2%, alle 8 Jahre positiv\
  \ (2020 +3.5%, 2022 +5.3%). -> Die Margen-Annahme von H-009 (-30% symmetrisch) war\
  \ KONSERVATIV; die asymmetrische Realitaet verbessert das Ergebnis leicht. Der Edge\
  \ ueberlebt selbst die brutalste realistische Marge; die verbleibende Unbekannte\
  \ (echte Broker-Tabelle) verschiebt die Zahl innerhalb 1.5-1.7 Sharpe, nicht das\
  \ Vorzeichen. ZIELBAND: +12.9..14.2%/yr bei 8.4% Vola -> fuer 2%/Monat braucht es\
  \ ~2.0-2.1x Hebel (Vola ~17%, MDD ~-18..-19%) -> Eigenkapital oder 20%-Limit-Konto,\
  \ nicht FTMO-Standard."
