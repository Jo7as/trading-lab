id: H-006
titel: Relative Bewegung zwischen eng verbundenen Majors kehrt intraday zurück
status: kill
skript: studies/run_h005_h006.py
stufe: S1
erstellt: 2026-10-24
autor: ''
beobachtung: 'EURUSD, GBPUSD und die Dollar-Majors bewegen sich überwiegend gemeinsam
  (Dollar-Faktor). Weicht ein Paar intraday stark vom gemeinsamen Faktor ab, kehrt
  ein Teil der Abweichung innerhalb der Session zurück (verzögerte Informationsverarbeitung,
  unterschiedliche Liquidität in den Paaren).

  '
mechanismus:
  wer: Marktteilnehmer, die relativ preisen (Cross-Paare, Stat-Arb-Desks, Options-Hedger)
  warum: 'Bei eng verbundenen Paaren mit gemeinsamem Risikofaktor ist eine große relative
    Abweichung meist Liquidität, nicht Information; Market Maker und Cross-Arb stellen
    die Verbindung wieder her.

    '
  quellen:
  - Literatur zu FX-Faktorstruktur und Cross-Pair-Relative-Value (Dollar-Faktor, Carry-Faktor)
zustaende:
- familie: Z8
  definition: 'relative Rendite seit Session-Start (03:00 NY) von Paar A gegen Paar
    B, z-Normierung mit der 14-Tage-Verteilung derselben Uhrzeit; Family A={EURUSD,
    GBPUSD}, B={USDJPY, AUDUSD} (Dollar-neutral gewichtet).

    '
  einheit: sigma
- familie: Z4
  definition: Ereignis nur ab London-Open + 60 Minuten
  einheit: session_min
ort: keiner
zeit: Entry beim ersten |z| >= 2 in der London/NY-Session, Exit bei |z| <= 0,5 oder
  Session-Ende
ereignis_definition: ein Ereignis je Paar und Tag; thin_days ausgeschlossen
richtung: gegen die relative Abweichung
horizont_min: 60
instrumente:
- EURUSD
- GBPUSD
- USDJPY
- AUDUSD
behauptung: 'Mittlere Vorwärtsrendite in Rücknahmerichtung der relativen Abweichung
  ist >= min_effekt_bp und netto > 0 (beide Legs zu echten Bid/Ask bewertet).

  '
placebo: 'Dieselbe z-Schwelle auf geshuffelte Paar-Zuordnungen (A gegen einen unabhängigen
  Major), wo kein gemeinsamer Faktor existiert.

  '
dosis_wirkung:
  staerke_variable: '|z| der relativen Abweichung, in Quintilen'
  erwartung: monoton_steigend
s0:
  kosten_rt_bp: 0.533
  typische_bewegung_bp: 4.42
  s0_quote: 0.1206
  grenze: 0.1
  min_effekt_bp: 1.066
  kurz_horizont_begruendung: ''
kill_kriterien:
  t_min: 3.0
  placebo_mindestabstand: 0.5
  dosis_rangkorrelation_min: 0.8
  vorzeichen_jahre_min: 0.7
  netto_effekt_min_bp: 0.0
varianten:
- name: basis
  aenderung: '|z| >= 2, Exit bei |z| <= 0,5'
- name: dollar_korb
  aenderung: B = gewichteter Dollar-Korb statt Einzelpaar
- name: nur_overlap
  aenderung: nur 08:00-11:00 NY (tiefste Spreads)
datenabschnitt: train
ergebnis: 'Erstmals GETESTET 2026-10-26 (studies/run_h005_h006.py, Train 2019-2024, beide Legs zu echten
  Bid/Ask, 5-Minuten-Raster). EURUSD/GBPUSD: brutto -2.4..+0.2 bp -> kein Effekt. AUDUSD/NZDUSD: ECHTER
  Brutto-Effekt +1.7..+3.1 bp je Ereignis (t brutto 2.8..3.5, Placebo EURGBP/AUDNZD -0.05 bp, Dosis grob
  steigend), aber die Kosten zweier Legs (~3.3 bp) machen ihn netto negativ (-0.2..-1.7 bp). -> kill an S2
  (gemessen, nicht prognostiziert). Offene Spur: mit Limit-Einstieg (halber Spread je Leg) koennte die
  z>=2.5-overlap-Variante netto positiv werden - nur mit NEUER Karte und Fill-Simulation.'
