  aenderung: nur G10-Paare ohne PLN/HUF/CZK/NOK/SEK
- name: ohne_filter
  aenderung: Kontrolle
datenabschnitt: train
ergebnis: 'Getestet 2026-10-24. Teil 1 (Handtabelle, Jahresschaetzung): Preis+Filter
  +10.3%/Sharpe 1.32, mit Swap +16.8%/2.12. Teil 2 (VALIDIERUNG mit echten Daten):
  (a) Zinsen jetzt aus FRED (monatliche 3M-Interbank, 14 Waehrungen, bis 2026); (b)
  Broker-Marge als Sensitivitaet; (c) Roll-Diagnostik. Ergebnis mit echten Zinsen
  (n=64 Monate, Filter): NUR PREIS +8.7%/Sharpe 1.07/MDD -10.2%; +Swap volle Differenz
  +15.8%/1.93/-8.4%; -30% Marge +13.6%/1.67/-8.9%; -50% Marge +12.2%/1.50/-9.3%; G10-only
  (-30%) +9.5%/1.09/-13.2%. -> Der Edge ueberlebt selbst die Haelfte der Zinsdifferenz.
  Die Handtabelle war zu optimistisch (Preis-Scharpe 1.32 vs 1.07, MDD -4.7% vs -10.2%);
  massgeblich sind die FRED-Zahlen. ROLL-DIAGNOSTIK: Der CFD-Preis zahlt den Carry
  NICHT (Median-Roll-Rendite -0.8..-2.3 bp fuer ALLE Paare, unabhaengig vom Vorzeichen
  der Differenz = Roll-Fenster-Artefakt, das der Audit als session_edge ausschliesst).
  -> Swap muss wie modelliert separat angesetzt werden. PROP/KORREKTUR: bei 1x MDD
  -8.4..-10.2% -> bei 1.6x Hebel ~-13..-16% und damit UEBER einem 10%-Prop-Limit;
  fuer FTMO-Standard nur <=1x (dann 1.0-1.3%/Monat, unter dem Zielband), oder ein
  Konto mit 20%-Limit/Eigenkapital. Zusaetzlich: Carry verlangt Overnight-/Wochenend-Haltung
  (Firmenregeln pruefen).'
entscheidung: 'Registriert und getestet; Train UND Holdout positiv im Preis, Filter-Effekt
  repliziert. Naechster Pflichtschritt vor jedem Kapital: echte Broker-Swap/Spread-Daten.'
