id: H-008
titel: FX-Carry funktioniert nur im ruhigen Regime (Risikofilter) - monatlich, Korb
status: bestanden_validate
erstellt: 2026-10-24
autor: ''
beobachtung: 'Der Carry-Faktor (Zinsdifferenz) ist der dokumentierte klassische FX-Praemie-Edge
  (Lustig/Verdelhan/Roussanov 2007) mit dokumentiertem Crash-Verhalten in Liquiditaets-/Risk-off-Phasen
  (Brunnermeier/Nagel/Pedersen 2008). Erste eigene Messung: ohne Filter fast wirkungslos
  im Preis (Sharpe 0.16), mit einem Ruhe-Filter deutlich positiv - und das out-of-sample.

  '
mechanismus:
  wer: Carry-Investoren (Fonds, Corporates) als Risikopraemie-Empfaenger; Funding-Waehrungen
    JPY/CHF
  warum: 'Wer die Hochzins-Waehrung haelt, bekommt die Zinsdifferenz (Swap) und traegt
    dafuer Liquiditaets-/Crash-Risiko. Die Praemie verschwindet genau dann, wenn das
    Risiko realisiert wird (Risk-off) - deshalb ein Regime-Filter statt eines besseren
    Signals.

    '
  quellen:
  - 'Lustig, Verdelhan, Roussanov (2007): Common Risk Factors in Currency Markets,
    RFS'
  - 'Brunnermeier, Nagel, Pedersen (2008): Carry Trades and Currency Crashes, NBER
    Macro Annual'
  - 'eigene Messung: studies/run_carry.py (+ Risikofilter-Variante)'
zustaende:
- familie: Z8
  definition: 'carry_p = rate(base) - rate(quote) je Paar/Woche aus der Zinstabelle
    (grobe Jahresmittel, Ranking-Faktor); Korb aus 26 G10+/exotischen Paaren.

    '
  einheit: verhaeltnis
- familie: Z1
  definition: 'Regime: VIX-Perzentil der letzten 250 Handelstage < 70 (nur dann aktiv)'
  einheit: perzentil
ort: keiner
zeit: monatliches Rebalancing (Monatsende), Long Top-4 / Short Bottom-4 nach Carry,
  gleichgewichtet
ereignis_definition: jeden Monat; Handel nur wenn das Regime ruhig ist (VIX-Perzentil
  < 70)
richtung: long Hochzins / short Niedrigzins
horizont_min: 20160
instrumente:
- EURUSD
- GBPUSD
- USDJPY
- AUDUSD
- NZDUSD
- USDCAD
- USDCHF
- EURCHF
- EURJPY
- EURGBP
