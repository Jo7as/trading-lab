  je Tag
richtung: gegen den Pre-Fix-Flow (Rücknahme)
horizont_min: 60
instrumente:
- EURUSD
- GBPUSD
- USDJPY
- AUDUSD
behauptung: 'Mittlere Vorwärtsrendite in Rücknahmerichtung über die Stunde nach dem
  Fix ist >= min_effekt_bp und netto > 0; das Placebo zur gleichen Uhrzeit an einem
  anderen Tag zeigt keinen Effekt.

  '
placebo: Gleicher Aufbau, aber Fix-Zeitpunkt um 09:00 NY statt 11:00 NY (kein Benchmark-Flow)
