id: H-005
titel: 'London-16:00-Fix (WMR): Drift vor dem Fix, Rücknahme danach'
status: kill
erstellt: 2026-10-24
autor: ''
beobachtung: 'Der WM/Refinitiv-4-Uhr-Fix (16:00 London = 11:00 New York) ist ein Zeitpunkt,
  zu dem täglich große, vorab platzierte Orders abgearbeitet werden. Vor dem Fix entsteht
  gerichteter Druck, nach dem Fix fehlt der Abnehmer, und ein Teil der Bewegung wird
  zurückgenommen.

  '
mechanismus:
  wer: Fonds mit Fix-Vorgabe (Benchmark-Abrechnung), Banken als Ausführer
  warum: 'Orders, die auf den Fix benchmarkt sind, müssen in einem 5-Minuten-Fenster
    um 16:00 London ausgeführt werden, egal wie der Kurs steht. Das erzeugt vor dem
    Fix gerichteten Druck (und Manipulationsanreize), der danach wegfällt.

    '
  quellen:
  - Literatur zu WMR-Fix und Benchmark-Orders (z. B. Melvin/Roos; BIS FX Benchmark
    Reforms)
zustaende:
- familie: Z4
  definition: 'Fenster um 11:00 New York: Pre-Fix 10:00-11:00, Post-Fix 11:00-12:00'
  einheit: session_min
- familie: Z2
  definition: Abstand des Kurses um 10:59 NY zur Session-Eröffnung, in Spread-Einheiten
    (Richtung des Pre-Fix-Flows)
  einheit: spread
ort: Session-Eröffnung als Bezug
zeit: Entry 11:00 NY (Fix), Exit 12:00 NY; Placebo derselbe Aufbau um 09:00 NY
