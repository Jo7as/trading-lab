red_flags:
  - "Die finalen 'profitablen Settings' werden im Video NICHT gezeigt. Erst nach mehreren erfolglosen Versuchen 'gefunden' -> starkes Overfitting-Risiko."
  - "Nur ~18 Monate Daten, kein Out-of-Sample erkennbar."
  - "Größter Einzelverlust $2,185 > Lucid Max Total Loss $1,000 und > Daily Loss $600. Bei 3x Größe erst recht. Die 73.8% Pass-Rate passt damit nicht zusammen."
